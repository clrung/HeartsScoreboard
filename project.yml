include:
  - project.local.yml

name: HeartsScoreboard
options:
  bundleIdPrefix: com.clrungdev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
attributes:
  LastUpgradeCheck: "2710"
settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    knownRegions: "en Base es fr it de pt ja ko zh-Hans zh-Hant nl ru ar pl tr vi th id sv hi uk he cs da fi el hu ro ms nb ca hr sk bg sl et lv lt sr-Latn bs is fil fa ur gu kn ml mr pa ta te bn am az eu gl mk sq sw hy ka km lo mn ne si uz kk cy zu af my pt-PT es-419 sr"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
  configs:
    Debug:
      EAGER_COMPILATION_ALLOW_SCRIPTS: YES
targets:
  HeartsScoreboard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clrungdev.Hearts-Scoreboard
        INFOPLIST_FILE: HeartsScoreboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: HeartsScoreboard/HeartsScoreboard.entitlements
        MARKETING_VERSION: "4.0.0"
        CURRENT_PROJECT_VERSION: "12"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Scoreboard
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.card-games
    sources:
      - path: HeartsScoreboard
    info:
      path: HeartsScoreboard/Info.plist
      properties:
        CFBundleDisplayName: Scoreboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: ""
  HeartsScoreboardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HeartsScoreboardTests
    dependencies:
      - target: HeartsScoreboard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.clrungdev.Hearts-ScoreboardTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HeartsScoreboard.app/HeartsScoreboard
        BUNDLE_LOADER: $(TEST_HOST)
  HeartsScoreboardUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HeartsScoreboardUITests
    dependencies:
      - target: HeartsScoreboard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.clrungdev.Hearts-ScoreboardUITests
        TEST_TARGET_NAME: HeartsScoreboard
schemes:
  # App Store screenshots (scripts/screenshots.sh). Kept separate so the normal unit-test run stays fast.
  HeartsScoreboardScreenshots:
    build:
      targets:
        HeartsScoreboard: all
        HeartsScoreboardUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HeartsScoreboardUITests
  HeartsScoreboard:
    build:
      targets:
        HeartsScoreboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HeartsScoreboardTests
    profile:
      config: Release
    archive:
      config: Release
